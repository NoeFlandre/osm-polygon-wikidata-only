name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # The deterministic gate includes the full suite, three CRAP scopes, and
    # bounded mutation tests. Keep enough time for a cold runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@just
      - name: Install Python
        run: uv python install 3.12
      - name: Run the deterministic QA gauntlet
        run: just quality-gauntlet

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the non-root runtime image
        run: docker build --target runtime --tag osm-polygon-wikidata-only:ci .
      - name: Verify the safe default command
        run: docker run --rm osm-polygon-wikidata-only:ci --help
