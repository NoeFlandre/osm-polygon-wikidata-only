name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@just
      - name: Install Python
        run: uv python install 3.12
      - name: Run the complete quality gate
        run: just check

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the non-root runtime image
        run: docker build --target runtime --tag osm-polygon-wikidata-only:ci .
      - name: Verify the safe default command
        run: docker run --rm osm-polygon-wikidata-only:ci --help

  test-strength:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@just
      - name: Install Python
        run: uv python install 3.12
      - name: Run mutation and CRAP gates
        run: just quality-strength
