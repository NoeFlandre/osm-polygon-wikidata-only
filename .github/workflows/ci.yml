name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # The deterministic gate includes the full suite, all configured CRAP scopes, and
    # bounded mutation tests. Keep enough time for a cold runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: taiki-e/install-action@cb30b4c9cca98bbd320daf128741850f83d8a99f # v2 (just)
        with:
          tool: just
      - name: Install Python
        run: uv python install 3.12
      - name: Verify the lockfiles match pyproject.toml
        run: |
          uv lock --check
          uv lock --check --directory preprocessing
      - name: Run the deterministic QA gauntlet
        env:
          # CI runners have more headroom than local Macs; keep the same
          # mutation population while reducing wall-clock time.
          MUTMUT_MAX_CHILDREN: "4"
        run: just quality-gauntlet

  preprocessing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: taiki-e/install-action@cb30b4c9cca98bbd320daf128741850f83d8a99f # v2 (just)
        with:
          tool: just
      - name: Install Python
        run: uv python install 3.12
      - name: Run preprocessing quality checks
        run: just preprocessing-check

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the development test image
        run: docker build --target development --tag osm-polygon-wikidata-only:ci-development .
      - name: Run the development pytest suite
        run: docker run --rm osm-polygon-wikidata-only:ci-development
      - name: Build the non-root runtime image
        run: docker build --target runtime --tag osm-polygon-wikidata-only:ci .
      - name: Verify the safe default command
        run: docker run --rm osm-polygon-wikidata-only:ci --help
