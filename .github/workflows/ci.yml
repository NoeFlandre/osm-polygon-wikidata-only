name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its in-progress run; pushes to main
# always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # The deterministic gate includes the full suite, all configured CRAP scopes,
    # bounded mutation tests, and (via `architecture-checks`) the strict docs
    # build, wheel/sdist build, package smoke install and the preprocessing
    # checks, so no separate job repeats them. Keep enough time for a cold runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: taiki-e/install-action@cb30b4c9cca98bbd320daf128741850f83d8a99f # v2 (just)
        with:
          tool: just
      - name: Install Python
        run: uv python install 3.12
      - name: Verify the lockfiles match pyproject.toml
        run: |
          uv lock --check
          uv lock --check --directory preprocessing
      - name: Run the deterministic QA gauntlet
        env:
          # CI runners have more headroom than local Macs; keep the same
          # mutation population while reducing wall-clock time.
          MUTMUT_MAX_CHILDREN: "4"
        run: just quality-gauntlet

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: taiki-e/install-action@cb30b4c9cca98bbd320daf128741850f83d8a99f # v2 (just)
        with:
          tool: just
      - name: Install Python
        run: uv python install 3.12
      - name: Audit both lockfiles for known vulnerabilities
        run: just audit

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the development test image
        run: docker build --target development --tag osm-polygon-wikidata-only:ci-development .
      - name: Run the development pytest suite
        run: docker run --rm osm-polygon-wikidata-only:ci-development
      - name: Build the non-root runtime image
        run: docker build --target runtime --tag osm-polygon-wikidata-only:local .
      - name: Validate the Compose runtime configuration
        run: docker compose config --quiet
      - name: Create the Compose bind-mount data root
        run: mkdir -p ../osm-polygon-data/raw
      - name: Smoke-test the Compose runtime help
        run: docker compose run --rm --no-deps pipeline --help
      - name: Verify Compose bind-mount permissions
        run: |
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" \
            docker compose run --rm --no-deps \
              --entrypoint /bin/sh pipeline \
              -ec 'touch /data/.compose-writable-check
              if touch /data/raw/.compose-readonly-check 2>/dev/null; then
                rm -f /data/raw/.compose-readonly-check
                echo "raw bind mount unexpectedly allows writes" >&2
                exit 1
              fi
              rm /data/.compose-writable-check'

  # Warn-only observation period (issue #125): regressions are reported but do not
  # fail the build. Switch BENCH_MODE to ``enforce`` after one week of stable runs
  # against a baseline recorded from this job's bench.json on the CI runner type. Shared runners are
  # noisy, so this is not part of ``all-green``.
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BENCH_MODE: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: taiki-e/install-action@cb30b4c9cca98bbd320daf128741850f83d8a99f # v2 (just)
        with:
          tool: just
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just sync
      - name: Run the benchmark suite
        run: just bench-json bench.json
      - name: Compare with the committed baseline
        run: just bench-compare "$BENCH_MODE" bench.json

  # The single required status check: it fails unless every needed job succeeded.
  all-green:
    if: always()
    needs: [quality, security, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job finished with '$result'."
              exit 1
            fi
          done
