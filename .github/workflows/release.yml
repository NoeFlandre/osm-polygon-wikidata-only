name: Release

# Build the sdist and wheel from a version tag and attach them to a GitHub
# Release. The tag must match the version in pyproject.toml (the only source).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Gate: only a commit that is already on main and passed CI may be released.
  # Read-only; the release job below is the only one that gets `contents: write`.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "Tagged commit ${GITHUB_SHA} is not an ancestor of origin/main" >&2
            exit 1
          }
      - name: Require a successful CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successes="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == "'"${GITHUB_SHA}"'" and .conclusion == "success")] | length')"
          if [[ "${successes}" -lt 1 ]]; then
            echo "No successful CI workflow run found for ${GITHUB_SHA}" >&2
            exit 1
          fi

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install Python
        run: uv python install
      - name: Check the tag matches the package version
        id: version
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          }
          public_version="${version%%+*}"
          if [[ "${public_version}" =~ (a|b|rc)[._-]?[0-9]*|\.dev[._-]?[0-9]* ]]; then
            echo "is_prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Create the GitHub Release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          release_args=("${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --verify-tag --generate-notes)
          if [[ "${IS_PRERELEASE}" == true ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
