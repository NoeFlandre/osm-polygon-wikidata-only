name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build documentation
        run: uv run mkdocs build --strict --site-dir site
      - name: Add public dataset presentation
        run: |
          mkdir -p site/presentations/assets
          cp presentations/dataset.html site/presentations/dataset.html
          cp presentations/codebase.html site/presentations/codebase.html
          cp presentations/assets/coverage_map.png site/presentations/assets/coverage_map.png
          cp presentations/assets/text_density.png site/presentations/assets/text_density.png
          cp presentations/assets/text_presence.png site/presentations/assets/text_presence.png
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
