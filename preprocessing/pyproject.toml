[project]
name = "osm-polygon-wikidata-only-preprocessing"
version = "0.1.0"
description = "Preprocess OSM polygons using Wikidata-linked features."
authors = [
    { name = "NoeFlandre", email = "noeflandre@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
]

[project.scripts]
osm-polygon-wikidata-only-preprocessing = "osm_polygon_wikidata_only_preprocessing.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
