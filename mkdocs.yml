site_name: OSM Polygon Wikidata Only
site_description: OpenStreetMap polygons enriched with Wikidata, Wikipedia, and Wikivoyage data.
site_url: https://noeflandre.github.io/osm-polygon-wikidata-only/
repo_name: NoeFlandre/osm-polygon-wikidata-only
repo_url: https://github.com/NoeFlandre/osm-polygon-wikidata-only
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

exclude_docs: |
  superpowers/**
  .DS_Store

nav:
  - Home: index.md
  - API reference: api.md
  - Architecture: architecture.md
  - Development: development.md
  - V2 sentence splitting: sentence-splitting.md
