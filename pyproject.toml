[project]
name = "osm-polygon-wikidata-only"
version = "0.1.0"
description = "OSM polygons with Wikidata facts and multilingual Wikipedia and Wikivoyage text."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Noé Flandre" }]
license = { file = "LICENSE" }
keywords = ["openstreetmap", "wikidata", "wikipedia", "wikivoyage", "geospatial", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "h3>=4.5.0",
    "huggingface-hub>=1.32.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "osmium>=4.3.1",
    "pyarrow>=24.0.0",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "tqdm>=4.68.4",
    "trackio>=0.34.0,<1",
]

[project.scripts]
osm-polygon-wikidata-only = "osm_polygon_wikidata_only.cli.app:run"
osm-polygon-wikidata-only-enforce-integrity = "osm_polygon_wikidata_only.cli.enforce_integrity:run"
osm-polygon-wikidata-only-audit-remote = "osm_polygon_wikidata_only.cli.audit_remote:run"
osm-polygon-wikidata-only-trackio = "osm_polygon_wikidata_only.hf.trackio_snapshot:run"
osm-polygon-wikidata-and-wikipedia-trackio = "osm_polygon_wikidata_only.hf.v2_trackio_snapshot:run"

[project.urls]
Source = "https://github.com/NoeFlandre/osm-polygon-wikidata-only"
Issues = "https://github.com/NoeFlandre/osm-polygon-wikidata-only/issues"
Dataset = "https://huggingface.co/datasets/NoeFlandre/osm-polygon-wikidata-only"

[project.optional-dependencies]
sentence-splitting = ["wtpsplit[onnx-cpu]==2.2.1"]
sentence-splitting-gpu = [
    "wtpsplit[onnx-gpu]==2.2.1",
    "onnxruntime-gpu[cuda,cudnn]==1.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_polygon_wikidata_only"]

[tool.hatch.build.targets.wheel.force-include]
"src/osm_polygon_wikidata_only/hf/ne_110m_admin_0_countries.geojson" = "osm_polygon_wikidata_only/hf/ne_110m_admin_0_countries.geojson"
"assets/dataset_hero.png" = "osm_polygon_wikidata_only/assets/dataset_hero.png"
"assets/dataset_hero_v2.png" = "osm_polygon_wikidata_only/assets/dataset_hero_v2.png"

[dependency-groups]
dev = [
    "datasets>=5.0.1",
    "hypothesis>=6.168.0,<7",
    "pytest-bdd>=8.1.0,<9",
    "mkdocs-material>=9.7.7,<10",
    "mutmut>=3.7.0,<4",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0,<4",
    "radon>=6.0.1,<7",
    "ruff>=0.15.20,<0.16",
    "ty==0.0.64",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that read a real PBF fixture",
    "requires_just: tests that execute the `just` command runner; skipped when it is not installed",
    "repository: contracts that need a full source checkout, not a pruned build context",
]
filterwarnings = [
    "ignore::DeprecationWarning:botocore.*",
    "ignore::DeprecationWarning:s3transfer.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "TID", "PLC0415", "BLE", "ARG", "PLW", "T20", "C4", "PERF", "RET", "PIE", "PTH", "ERA", "C90", "PLR0913", "PGH004"]
ignore = [
    "S101",  # asserts are fine in tests
    "S104",  # binding to all interfaces is fine for local-only services
    "S311",  # we don't use random for crypto
    "E501",  # line length is enforced by the formatter
    "B008",  # function call in argument default is fine for dataclass field defaults
    "PTH105",  # os.replace is the atomic-install primitive; tests fault-inject it via module.os
]

[tool.ruff.lint.mccabe]
# src/scripts/preprocessing already satisfy the target of 10; tests are exempt.
max-complexity = 10

[tool.ruff.lint.pylint]
# Ratchet: current maximum; lower as parameters are grouped into dataclasses (see #97).
max-args = 23

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B", "SIM", "PLC0415", "ARG", "T20", "BLE001", "C901", "PERF401"]
"preprocessing/tests/**/*.py" = ["ARG", "T20", "BLE001", "C901", "PERF401"]
"src/osm_polygon_wikidata_only/cli/**/*.py" = ["T201"]
"scripts/**/*.py" = ["T201"]
"preprocessing/scripts/**/*.py" = ["T201"]
"preprocessing/src/osm_polygon_wikidata_only_preprocessing/cli.py" = ["T201"]
"preprocessing/tests/test_article_deduplication.py" = ["S608"]  # Fixture SQL escapes paths
"src/osm_polygon_wikidata_only/enrichment/*.py" = ["S310"]
"src/osm_polygon_wikidata_only/hf/coverage_map.py" = ["S310"]
"src/osm_polygon_wikidata_only/hf/uploader.py" = ["S310"]
"tests/fixtures/_builders.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["src/osm_polygon_wikidata_only", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.mutmut]
# Keep exhaustive mutation focused on pure deterministic helpers.
on_dependency_change = "rerun"
source_paths = [
    "src/osm_polygon_wikidata_only/v2/deduplication.py",
    "src/osm_polygon_wikidata_only/v2/fingerprints.py",
    "src/osm_polygon_wikidata_only/v2/wikipedia_tags.py",
    "src/osm_polygon_wikidata_only/enrichment/wikipedia/parsing.py",
    "src/osm_polygon_wikidata_only/enrichment/wikidata/parsing.py",
    "src/osm_polygon_wikidata_only/domain/wikidata_qids.py",
    "src/osm_polygon_wikidata_only/io/pbf_reader.py",
    "src/osm_polygon_wikidata_only/hf/_upload_state.py",
    "src/osm_polygon_wikidata_only/hf/_upload_retry.py",
    "src/osm_polygon_wikidata_only/hf/language_split_release.py",
    "src/osm_polygon_wikidata_only/v2/language_splits.py",
    "src/osm_polygon_wikidata_only/v2/sentence_logic.py",
    "src/osm_polygon_wikidata_only/grid5000/sentence_protocol.py",
    "scripts/quality/package_smoke.py",
    "scripts/quality/qa_gauntlet.py",
    "scripts/quality/architecture.py",
]
also_copy = ["src/osm_polygon_wikidata_only", "requirements"]
mutate_only_covered_lines = true
# Generated dataclass frames have no filesystem path. Unlimited stack depth
# also avoids omitting tests that reach validation through several adapters.
max_stack_depth = -1
pytest_add_cli_args = ["--no-cov", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/v2/test_deduplication.py",
    "tests/v2/test_fingerprints.py",
    "tests/v2/test_wikipedia_tags.py",
    "tests/enrichment/test_parsing_quality.py",
    "tests/enrichment/test_enrichment.py",
    "tests/domain/test_multi_qid_osm_tags.py",
    "tests/domain/test_qid_parser_boundary.py",
    "tests/io/test_pbf_reader_area_quality.py",
    "tests/io/test_pbf_reader_contracts.py",
    "tests/io/test_upload_queue.py",
    "tests/io/test_upload_queue_legacy_migration.py",
    "tests/hf/test_hf.py",
    "tests/hf/test_language_split_release.py",
    "tests/hf/test_upload_operation_helpers.py",
    "tests/hf/test_upload_state.py",
    "tests/v2/test_language_splits.py",
    "tests/v2/test_language_splits_partition_writing.py",
    "tests/v2/test_language_splits_resume_buffers.py",
    "tests/v2/test_pbf_reader_scope.py",
    "tests/v2/test_sentence_logic.py",
    "tests/grid5000/test_sentence_protocol.py",
    "tests/grid5000/test_sentence_artifacts.py",
    "tests/quality/test_package_smoke.py",
    "tests/quality/test_qa_gauntlet.py",
    "tests/quality/test_architecture.py",
    "tests/quality/test_architecture_imports.py",
]
